<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Your Workspace | Words and Music on Wheels</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Literata:ital,wght@0,400;0,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .admin-wrap{ position:relative; z-index:1; max-width:760px; margin:0 auto; padding:6vh 6vw 10vh; }
  .admin-wrap h1{ font-size:2rem; font-weight:800; margin-bottom:0.4rem; color:var(--ink); }
  .admin-wrap .sub{ font-family:var(--mono); font-size:0.8rem; color:var(--ink-soft); margin-bottom:2.4rem; }
  .gate, .panel{
    background:rgba(255,255,255,0.86);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid var(--line); border-radius:18px; padding:1.8rem 2rem; margin-bottom:2rem;
    box-shadow:0 14px 34px rgba(22,21,29,0.1);
  }
  .field{ display:flex; flex-direction:column; gap:0.4rem; margin-bottom:1.1rem; }
  .field label{ font-family:var(--mono); font-size:0.72rem; letter-spacing:0.05em; color:var(--ink-soft); }
  .field input, .field textarea{
    font-family:var(--serif); font-size:0.98rem; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:0.65rem 0.85rem; resize:vertical;
  }
  .field input:focus, .field textarea:focus{ outline:2px solid var(--indigo); outline-offset:1px; }
  .btn{
    background:var(--indigo); color:#fff; border:none; border-radius:999px;
    padding:0.65rem 1.5rem; font-family:var(--display); font-weight:700;
    font-size:0.9rem; cursor:pointer; transition:opacity 0.2s ease;
  }
  .btn:hover{ opacity:0.88; }
  .btn.danger{ background:var(--coral); }
  .btn.ghost{ background:none; border:1px solid var(--line); color:var(--ink-soft); }
  .status{ font-family:var(--mono); font-size:0.8rem; margin-top:0.8rem; min-height:1.2em; }
  .status.error{ color:var(--coral); }
  .status.ok{ color:var(--teal); }
  .entry-list{ display:flex; flex-direction:column; gap:1rem; }
  .entry-row{
    background:rgba(255,255,255,0.6); border:1px solid var(--line); border-radius:14px;
    padding:1rem 1.2rem; display:flex; justify-content:space-between; align-items:flex-start; gap:1rem;
  }
  .entry-row .meta{ font-family:var(--mono); font-size:0.72rem; color:var(--ink-soft); margin-bottom:0.2rem; }
  .entry-row h3{ font-size:1.05rem; font-weight:700; margin-bottom:0.3rem; }
  .entry-row .actions{ display:flex; gap:0.5rem; flex-shrink:0; }
  .entry-row .actions button{ font-size:0.78rem; padding:0.4rem 0.9rem; }
  #configBar{ display:flex; gap:0.8rem; flex-wrap:wrap; align-items:flex-end; margin-bottom:1.4rem; }
  #configBar .field{ margin-bottom:0; flex:1 1 220px; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="page-bg" aria-hidden="true"></div>

<div class="admin-wrap">
  <h1>Your Workspace</h1>
  <p class="sub">Login below to post, edit, and manage your poems</p>

  <div class="gate" id="configBar">
    <div class="field">
      <label for="apiBase">Worker API URL</label>
      <input type="text" id="apiBase" placeholder="https://wmw-poems-api.yoursubdomain.workers.dev">
    </div>
    <div class="field">
      <label for="token">Login token</label>
      <input type="password" id="token" placeholder="your private token">
    </div>
    <button class="btn" id="connectBtn">Login</button>
  </div>

  <p class="status" id="connectStatus"></p>

  <div id="app" hidden>
    <div class="panel">
      <h2 style="font-size:1.2rem; font-weight:800; margin-bottom:0.6rem;">First time setup</h2>
      <p style="font-family:var(--serif); font-size:0.92rem; color:var(--ink-soft); margin-bottom:1rem;">
        Your storage is empty. If you had the original 3 poems on the site before, import them here once —
        this is safe to skip if you already have poems saved.
      </p>
      <button class="btn ghost" id="seedBtn">Import original 3 poems</button>
      <p class="status" id="seedStatus"></p>
    </div>

    <div class="panel">
      <h2 style="font-size:1.2rem; font-weight:800; margin-bottom:1rem;">Add a new poem</h2>
      <div class="field">
        <label for="pDate">Date label (e.g. "14 June")</label>
        <input type="text" id="pDate" placeholder="14 June">
      </div>
      <div class="field">
        <label for="pTitle">Title</label>
        <input type="text" id="pTitle" placeholder="Poem title">
      </div>
      <div class="field">
        <label for="pBody">Lines (one per line)</label>
        <textarea id="pBody" rows="6" placeholder="Line one&#10;Line two&#10;Line three"></textarea>
      </div>
      <div class="field">
        <label for="pSign">Sign-off</label>
        <input type="text" id="pSign" value="— A.B.">
      </div>
      <button class="btn" id="addBtn">Add poem</button>
      <p class="status" id="addStatus"></p>
    </div>

    <div class="panel">
      <h2 style="font-size:1.2rem; font-weight:800; margin-bottom:1rem;">Existing poems</h2>
      <div class="entry-list" id="entryList"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var apiBaseInput = document.getElementById('apiBase');
  var tokenInput = document.getElementById('token');
  var connectBtn = document.getElementById('connectBtn');
  var connectStatus = document.getElementById('connectStatus');
  var app = document.getElementById('app');
  var entryList = document.getElementById('entryList');
  var addBtn = document.getElementById('addBtn');
  var addStatus = document.getElementById('addStatus');
  var seedBtn = document.getElementById('seedBtn');
  var seedStatus = document.getElementById('seedStatus');

  var apiBase = '';
  var token = '';

  try {
    apiBaseInput.value = sessionStorage.getItem('wmw_api_base') || '';
    tokenInput.value = sessionStorage.getItem('wmw_admin_token') || '';
  } catch(e){}

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function authHeaders(){
    return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
  }

  function loadPoems(){
    entryList.innerHTML = '<p class="status">Loading…</p>';
    fetch(apiBase + '/poems')
      .then(function(r){ return r.json(); })
      .then(function(poems){
        if(!poems.length){
          entryList.innerHTML = '<p class="status">No poems yet.</p>';
          return;
        }
        entryList.innerHTML = '';
        poems.forEach(function(poem){
          var row = document.createElement('div');
          row.className = 'entry-row';
          row.innerHTML =
            '<div>' +
              '<div class="meta">' + escapeHtml(poem.date || '') + '</div>' +
              '<h3>' + escapeHtml(poem.title) + '</h3>' +
              '<div style="font-size:0.85rem; color:var(--ink-soft); white-space:pre-line;">' +
                escapeHtml(poem.body.join('\n')) +
              '</div>' +
            '</div>' +
            '<div class="actions">' +
              '<button class="btn ghost" data-action="delete" data-id="' + poem.id + '">Delete</button>' +
            '</div>';
          entryList.appendChild(row);
        });
      })
      .catch(function(err){
        entryList.innerHTML = '<p class="status error">Could not load poems: ' + escapeHtml(err.message) + '</p>';
      });
  }

  entryList.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-action="delete"]');
    if(!btn) return;
    if(!confirm('Delete this poem? This cannot be undone.')) return;
    fetch(apiBase + '/poems/' + btn.dataset.id, { method:'DELETE', headers: authHeaders() })
      .then(function(r){ return r.json(); })
      .then(function(){ loadPoems(); })
      .catch(function(err){ alert('Delete failed: ' + err.message); });
  });

  seedBtn.addEventListener('click', function(){
    seedStatus.textContent = 'Importing…';
    seedStatus.className = 'status';
    fetch('poems.json')
      .then(function(r){
        if(!r.ok) throw new Error('poems.json not found at this path (status ' + r.status + ')');
        return r.json();
      })
      .then(function(poems){
        var chain = Promise.resolve();
        poems.forEach(function(poem){
          chain = chain.then(function(){
            return fetch(apiBase + '/poems', {
              method: 'POST',
              headers: authHeaders(),
              body: JSON.stringify(poem)
            });
          });
        });
        return chain;
      })
      .then(function(){
        seedStatus.textContent = 'Imported.';
        seedStatus.className = 'status ok';
        loadPoems();
      })
      .catch(function(err){
        seedStatus.textContent = 'Import failed: ' + err.message;
        seedStatus.className = 'status error';
      });
  });

  connectBtn.addEventListener('click', function(){
    apiBase = apiBaseInput.value.trim().replace(/\/$/, '');
    token = tokenInput.value.trim();
    if(!apiBase || !token){
      connectStatus.textContent = 'Enter both the Worker URL and your login token.';
      connectStatus.className = 'status error';
      return;
    }
    try {
      sessionStorage.setItem('wmw_api_base', apiBase);
      sessionStorage.setItem('wmw_admin_token', token);
    } catch(e){}

    connectStatus.textContent = 'Connecting…';
    connectStatus.className = 'status';

    fetch(apiBase + '/poems')
      .then(function(r){
        if(!r.ok) throw new Error('API responded with ' + r.status);
        return r.json();
      })
      .then(function(){
        connectStatus.textContent = 'Logged in.';
        connectStatus.className = 'status ok';
        app.hidden = false;
        loadPoems();
      })
      .catch(function(err){
        connectStatus.textContent = 'Could not log in: ' + err.message;
        connectStatus.className = 'status error';
      });
  });

  addBtn.addEventListener('click', function(){
    var date = document.getElementById('pDate').value.trim();
    var title = document.getElementById('pTitle').value.trim();
    var bodyLines = document.getElementById('pBody').value.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
    var sign = document.getElementById('pSign').value.trim() || '— A.B.';

    if(!title || !bodyLines.length){
      addStatus.textContent = 'Title and at least one line are required.';
      addStatus.className = 'status error';
      return;
    }

    addStatus.textContent = 'Saving…';
    addStatus.className = 'status';

    fetch(apiBase + '/poems', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ date: date, title: title, body: bodyLines, sign: sign })
    })
      .then(function(r){
        if(!r.ok) throw new Error('Save failed with status ' + r.status);
        return r.json();
      })
      .then(function(){
        addStatus.textContent = 'Poem added.';
        addStatus.className = 'status ok';
        document.getElementById('pDate').value = '';
        document.getElementById('pTitle').value = '';
        document.getElementById('pBody').value = '';
        loadPoems();
      })
      .catch(function(err){
        addStatus.textContent = err.message;
        addStatus.className = 'status error';
      });
  });

  if(apiBaseInput.value && tokenInput.value){
    connectBtn.click();
  }
})();
</script>
</body>
</html>
